<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>ProArc Swagger</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css">
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            background: #f7f8fa;
        }

        .topbar {
            display: none;
        }

        #swagger-ui {
            min-height: 100%;
        }

        .swagger-auth-status {
            border-bottom: 1px solid #d8dde3;
            box-sizing: border-box;
            font-family: sans-serif;
            font-size: 14px;
            font-weight: 600;
            min-height: 18px;
            padding: 10px 16px;
        }

        .swagger-auth-status.logged {
            background: rgb(69, 106, 165);
            color: white;
        }

        .swagger-auth-status.nologged {
            background: #ffd7d7;
            color: #7f1d1d;
        }

        .swagger-auth-status.unknown {
            background: #ffffff;
            color: #57606a;
        }
    </style>
</head>
<body>
<div id="swagger-auth-status" class="swagger-auth-status"></div>
<div id="swagger-ui"></div>

<script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
<script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-standalone-preset.js"></script>
<script>
window.onload = async () => {
        const appPath = window.location.pathname.split('/swagger')[0];
        const basePath = appPath + '/swagger';
        const loginUrl = appPath + '/proarclogin';
        const isLoggedUrl = appPath + '/isLogged';
        const authStatus = document.getElementById('swagger-auth-status');
        let lastAuthorization = null;
        let loginPromise = null;

        const setStatus = (message, state) => {
            authStatus.textContent = message;
            authStatus.classList.remove('logged', 'nologged', 'unknown');
            authStatus.classList.add(state || 'unknown');
        };

        let mode;
        try {
            const response = await fetch(appPath + '/auth/config', { credentials: 'omit', redirect: 'error' });
            if (!response.ok) throw new Error('Authentication configuration unavailable');
            mode = (await response.json()).mode;
            if (mode !== 'proarc' && mode !== 'keycloak') throw new Error('Unknown authentication mode');
        } catch (error) {
            setStatus('Konfiguraci autentizace nelze načíst. Přihlašování je pozastavené.', 'unknown');
            return; // Never guess another authentication mode on failure.
        }
        const keycloak = mode === 'keycloak';

        const refreshLoginState = async () => {
            try {
                const response = await fetch(isLoggedUrl, { credentials: 'same-origin' });
                const data = await response.json();
                if (data.state === 'logged') {
                    setStatus('Přihlášen: ' + data.login + '. Cookie je uložena v prohlížeči.', 'logged');
                } else {
                    setStatus('Nepřihlášen!', 'nologged');
                }
            } catch (error) {
                setStatus('Stav přihlášení nelze načíst.', 'unknown');
            }
        };

        const loginWithAuthorization = async authorization => {
            if (authorization === lastAuthorization) return;
            const credentials = atob(authorization.replace(/^Basic\s+/i, ''));
            const separator = credentials.indexOf(':');
            const body = new URLSearchParams();
            body.set('j_username', separator >= 0 ? credentials.substring(0, separator) : credentials);
            body.set('j_password', separator >= 0 ? credentials.substring(separator + 1) : '');
            const response = await fetch(loginUrl, {
                method: 'POST', body, credentials: 'same-origin',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' }
            });
            if (!response.ok) {
                setStatus('Přihlášení selhalo.', 'nologged');
                throw new Error('Local login failed');
            }
            lastAuthorization = authorization;
            await refreshLoginState();
        };

        const inApplication = value => {
            const base = new URL(appPath + '/', window.location.origin);
            const target = new URL(value, window.location.href);
            return target.origin === base.origin && target.pathname.startsWith(base.pathname);
        };

        SwaggerUIBundle({
            url: basePath + '/proarc_openapi.json',
            dom_id: '#swagger-ui',
            deepLinking: true,
            persistAuthorization: false,
            withCredentials: !keycloak,
            requestInterceptor: async request => {
                request.headers = request.headers || {};
                request.credentials = keycloak ? 'omit' : 'same-origin';
                const authorization = request.headers.Authorization || request.headers.authorization;
                if (!authorization) return request;
                if (!inApplication(request.url)) throw new Error('Authorization outside ProArc is forbidden');
                if (keycloak) {
                    if (!/^Bearer\s+\S+$/i.test(authorization)) throw new Error('Only bearer authentication is enabled');
                    // Keep the original bearer header. Never invoke the password login endpoint.
                    setStatus('Keycloak: požadavek používá bearer token.', 'unknown');
                    return request;
                }
                if (!/^Basic\s+/i.test(authorization)) throw new Error('Bearer authentication is disabled');
                delete request.headers.Authorization;
                delete request.headers.authorization;
                loginPromise = loginPromise || loginWithAuthorization(authorization).finally(() => {
                    loginPromise = null;
                });
                await loginPromise;
                return request;
            },
            responseInterceptor: response => {
                if (keycloak && response.url && inApplication(response.url)
                        && (response.url.includes('/rest/') || response.url.includes('/isLogged'))) {
                    if (response.status === 401) setStatus('Neplatný token nebo neaktivní relace.', 'nologged');
                    else if (response.status === 403) setStatus('Chybí role proarc, propojený účet nebo oprávnění.', 'nologged');
                    else if (response.status === 503) setStatus('Ověření identity je dočasně nedostupné.', 'unknown');
                    else if (response.status >= 200 && response.status < 300) setStatus('Požadavek byl ověřen bearer tokenem.', 'logged');
                }
                return response;
            },
            presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
            layout: 'StandaloneLayout'
        });
        if (keycloak) {
            setStatus('Režim Keycloak: v Authorize vložte přístupový token bez prefixu Bearer. Obnovu tokenu provádí váš OIDC klient.', 'unknown');
        } else {
            await refreshLoginState();
        }
    };
</script>
</body>
</html>
